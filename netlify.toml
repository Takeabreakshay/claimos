# Netlify — static frontend from web/, proxy /api to the Render ML backend.
# Deploy: Netlify -> Add new site -> import the repo (this file is auto-detected).
# Like Vercel, Netlify can't run the Python backend; the proxy keeps it same-origin.
[build]
  publish = "web"
  command = ""

# Proxy every API call to the FastAPI service on Render (status 200 = rewrite/proxy).
[[redirects]]
  from = "/api/*"
  to = "https://claimos.onrender.com/api/:splat"
  status = 200
  force = true

# Customer app pretty URL.
[[redirects]]
  from = "/claim"
  to = "/claim.html"
  status = 200

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
