      quarter_panel: [14000, 26000]
      headlamp: [9000, 24000]
      tail_lamp: [4000, 11000]
      windshield_front: [9000, 18000]
      windshield_rear: [6000, 12000]
      door_glass: [3000, 6500]
      orvm: [4500, 12000]
      grille: [3500, 9000]
      radiator: [7000, 15000]
      condenser: [8000, 16000]
      airbag: [22000, 45000]
      airbag_module: [15000, 32000]
      suspension_strut: [6000, 12000]
