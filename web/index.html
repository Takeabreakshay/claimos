<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ClaimOS - Claims Operations</title>
<link rel="preload" href="/fonts/IBMPlexSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css?v=34" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
</head>
<body>
<div class="app">
  <!-- ============================ HEADER ============================ -->
  <header class="hdr" id="hdr">
    <button type="button" class="hdr-burger" id="burger" aria-label="Menu" aria-expanded="false">
      <svg class="ic-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <svg class="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <a class="hdr-brand" href="/" title="ClaimOS">
      <span class="hdr-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 4.5-3.2 8.3-8 11-4.8-2.7-8-6.5-8-11V5l8-3z" fill="currentColor"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="hdr-word">ClaimOS</span>
    </a>

    <nav class="hdr-nav" id="nav">
      <button type="button" data-v="dashboard" class="on">Dashboard</button>
      <button type="button" data-v="queue">Queue<span class="count" id="qcount">0</span></button>
      <button type="button" data-v="intake">New&nbsp;claim</button>
      <button type="button" data-v="workflow">How&nbsp;it&nbsp;works</button>
    </nav>
    <span class="hdr-div" aria-hidden="true"></span>
    <nav class="hdr-nav hdr-nav2" id="nav2">
      <button type="button" data-v="evidence">Evidence</button>
      <button type="button" data-v="decision">Decision</button>
    </nav>

    <div class="hdr-right">
      <div class="hdr-status" id="hdrStatus" tabindex="0">
        <span class="hdr-dots"><i class="dot-off" id="s-store"></i><i class="dot-off" id="s-models"></i><i class="dot-off" id="s-ocr"></i><i class="dot-off" id="s-llm"></i></span>
        <span class="hdr-status-lbl">Systems</span>
        <div class="hdr-pop">
          <div class="hdr-pop-t">System status</div>
          <div class="sysrow"><i class="dot-off"></i>Data store <span class="v" id="v-store">…</span></div>
          <div class="sysrow"><i class="dot-off"></i>Models <span class="v" id="v-models">…</span></div>
          <div class="sysrow"><i class="dot-off"></i>OCR <span class="v" id="v-ocr">…</span></div>
          <div class="sysrow"><i class="dot-off"></i>Reasoning <span class="v" id="v-llm">…</span></div>
        </div>
      </div>
      <a class="hdr-cta" href="/claim" target="_blank" rel="noopener">File a claim</a>
      <button type="button" class="hdr-icon" id="refresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
      </button>
      <label class="rolepick" title="Active role (maker-checker)">
        <span class="avatar" id="who">OF</span>
        <select id="roleSel" onchange="setRole(this.value)" aria-label="Active role">
          <option value="officer">Officer</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </label>
    </div>
  </header>

  <main class="content" id="view"></main>

  <!-- ===================== MOBILE BOTTOM TAB BAR ===================== -->
  <nav class="mnav" id="mnav" aria-label="Primary">
    <button type="button" data-v="dashboard" class="on" aria-label="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Home</span>
    </button>
    <button type="button" data-v="queue" aria-label="Queue">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>Queue</span><i class="mnav-count" id="mqcount"></i>
    </button>
    <button type="button" data-v="intake" class="m-new" aria-label="New claim">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>New</span>
    </button>
    <button type="button" data-v="workflow" aria-label="How it works">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 9a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2.2-2.6 4"/><path d="M12 17h.01"/></svg>
      <span>Guide</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<!-- motion engine: smooth scroll + scroll-driven choreography -->
<script src="/js/lenis.min.js"></script>
<script src="/js/gsap.min.js"></script>
<script src="/js/ScrollTrigger.min.js"></script>
<script src="/js/SplitText.min.js"></script>
<script src="/js/ScrambleTextPlugin.min.js"></script>
<script src="/js/CustomEase.min.js"></script>
<script src="/motion.js?v=16"></script>
<script src="/app.js?v=36"></script>
</body>
</html>
