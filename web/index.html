<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClaimOS — Claims Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=19" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
</head>
<body>
<div class="app">

  <!-- ============================ SIDEBAR ============================ -->
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="rail-logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 4.5-3.2 8.3-8 11-4.8-2.7-8-6.5-8-11V5l8-3z" fill="#fff" opacity=".96"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#0B2A5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>ClaimOS</h1>
        <span>CLAIMS OPERATIONS</span>
      </div>
    </div>

    <div class="rail-scroll">
      <div class="rail-sec">Workspace</div>
      <nav class="nav" id="nav">
        <button data-v="dashboard" class="on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
        </button>
        <button data-v="queue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Triage queue <span class="count" id="qcount">0</span>
        </button>
        <button data-v="intake">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          New claim
        </button>
        <button data-v="workflow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 16v5M5 12H3M21 12h-2"/><circle cx="12" cy="12" r="4"/><path d="M6.3 6.3 4.9 4.9M17.7 6.3l1.4-1.4M6.3 17.7l-1.4 1.4M17.7 17.7l1.4 1.4"/></svg>
          How it works
        </button>
        <a href="/claim" target="_blank" class="nav-link" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--rail-text);text-decoration:none;font-size:13.5px;font-weight:500">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
          Customer app <span style="margin-left:auto;font-size:10px;opacity:.6">↗</span>
        </a>
      </nav>

      <div class="rail-sec">Active claim</div>
      <nav class="nav" id="nav2">
        <button data-v="evidence">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/><path d="M7.5 5l1.2-1.8h6.6L16.5 5"/></svg>
          Evidence &amp; OCR
        </button>
        <button data-v="decision">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l7-5 7 5"/><path d="M3 12h6l-3 5-3-5zM15 12h6l-3 5-3-5z"/></svg>
          Decision
        </button>
      </nav>

      <div class="rail-status">
        <div class="t">System</div>
        <div class="sysrow"><i class="dot-off" id="s-store"></i>Data store <span class="v" id="v-store">…</span></div>
        <div class="sysrow"><i class="dot-off" id="s-models"></i>Models <span class="v" id="v-models">…</span></div>
        <div class="sysrow"><i class="dot-off" id="s-ocr"></i>OCR <span class="v" id="v-ocr">…</span></div>
        <div class="sysrow"><i class="dot-off" id="s-llm"></i>Reasoning <span class="v" id="v-llm">…</span></div>
      </div>
    </div>

    <div class="rail-foot">
      VAHAN · DigiLocker · IIB PRISM/QUEST run as mocked adapters —
      regulator-gated, swapped on go-live.
    </div>
  </aside>

  <!-- ============================ MAIN ============================ -->
  <div class="main">
    <header class="topbar">
      <button class="btn ghost railtoggle" id="railtoggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub">Portfolio health, lane mix and the leakage guardrail</div>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
        Refresh
      </button>
      <div class="who"><div class="avatar" id="who">OD</div><span id="whoName">officer.demo</span></div>
    </header>

    <main class="content" id="view"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- motion engine: smooth scroll + scroll-driven choreography -->
<script src="/js/lenis.min.js"></script>
<script src="/js/gsap.min.js"></script>
<script src="/js/ScrollTrigger.min.js"></script>
<script src="/js/SplitText.min.js"></script>
<script src="/js/ScrambleTextPlugin.min.js"></script>
<script src="/js/CustomEase.min.js"></script>
<script src="/motion.js?v=14"></script>
<script src="/app.js?v=19"></script>
</body>
</html>
