<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClaimOS — Claims Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=22" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
</head>
<body>
<div class="app">
  <!-- ============================ HEADER ============================ -->
  <header class="hdr" id="hdr">
    <a class="hdr-brand" href="/" title="ClaimOS">
      <span class="hdr-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 4.5-3.2 8.3-8 11-4.8-2.7-8-6.5-8-11V5l8-3z" fill="currentColor"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="hdr-word">ClaimOS</span>
    </a>

    <nav class="hdr-nav" id="nav">
      <button data-v="dashboard" class="on">Dashboard</button>
      <button data-v="queue">Queue<span class="count" id="qcount">0</span></button>
      <button data-v="intake">New&nbsp;claim</button>
      <button data-v="workflow">How&nbsp;it&nbsp;works</button>
    </nav>
    <span class="hdr-div" aria-hidden="true"></span>
    <nav class="hdr-nav hdr-nav2" id="nav2">
      <button data-v="evidence">Evidence</button>
      <button data-v="decision">Decision</button>
    </nav>

    <div class="hdr-right">
      <div class="hdr-status" id="hdrStatus" tabindex="0">
        <span class="hdr-dots"><i class="dot-off" id="s-store"></i><i class="dot-off" id="s-models"></i><i class="dot-off" id="s-ocr"></i><i class="dot-off" id="s-llm"></i></span>
        <span class="hdr-status-lbl">Systems</span>
        <div class="hdr-pop">
          <div class="hdr-pop-t">System status</div>
          <div class="sysrow"><i class="dot-off"></i>Data store <span class="v" id="v-store">…</span></div>
          <div class="sysrow"><i class="dot-off"></i>Models <span class="v" id="v-models">…</span></div>
          <div class="sysrow"><i class="dot-off"></i>OCR <span class="v" id="v-ocr">…</span></div>
          <div class="sysrow"><i class="dot-off"></i>Reasoning <span class="v" id="v-llm">…</span></div>
        </div>
      </div>
      <a class="hdr-cta" href="/claim" target="_blank" rel="noopener">File a claim<span class="hdr-cta-arw">↗</span></a>
      <button class="hdr-icon" id="refresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
      </button>
      <div class="avatar" id="who">OD</div>
    </div>
  </header>

  <main class="content" id="view"></main>
</div>

<div class="toast" id="toast"></div>

<!-- motion engine: smooth scroll + scroll-driven choreography -->
<script src="/js/lenis.min.js"></script>
<script src="/js/gsap.min.js"></script>
<script src="/js/ScrollTrigger.min.js"></script>
<script src="/js/SplitText.min.js"></script>
<script src="/js/ScrambleTextPlugin.min.js"></script>
<script src="/js/CustomEase.min.js"></script>
<script src="/motion.js?v=15"></script>
<script src="/app.js?v=21"></script>
</body>
</html>
